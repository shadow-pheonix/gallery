name: Build and release Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'Android/**'
      - '.github/workflows/build_android.yaml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
    env:
      # Public certificate fingerprint of the APK originally built for this fork.
      EXPECTED_CERT_SHA256: f7594eae3153851372465fe8bb10e2cf840b39bc8b9a8dcd75302e8ce7502c80
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and dependency cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" --install 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Restore the existing APK signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo '::error::ANDROID_DEBUG_KEYSTORE_BASE64 is required. Refusing to generate a new signing key.'
            exit 1
          fi
          keystore="$RUNNER_TEMP/edge-gallery-signing.keystore"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          actual_cert="$(keytool -exportcert -keystore "$keystore" \
            -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)"
          if [[ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]]; then
            echo '::error::The signing key does not match the existing APK certificate.'
            exit 1
          fi
          printf 'ANDROID_SIGNING_KEYSTORE=%s\n' "$keystore" >> "$GITHUB_ENV"

      - name: Test and build the release variant
        working-directory: Android/src
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease \
            --console=plain --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PciBuildNumber="$GITHUB_RUN_NUMBER"

      - name: Verify signature and prepare release files
        id: package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          apk='Android/src/app/build/outputs/apk/release/app-release.apk'
          verification="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verification"
          actual_cert="$(printf '%s\n' "$verification" | awk -F ': ' '/^Signer #1 certificate SHA-256 digest:/ {print $2}')"
          if [[ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]]; then
            echo '::error::The APK certificate does not match the existing installed APK.'
            exit 1
          fi
          version="$(python3 -c 'import json; print(json.load(open("Android/src/app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')"
          tag="v${version}.${GITHUB_RUN_ATTEMPT}"
          filename="edge-gallery-${version}.${GITHUB_RUN_ATTEMPT}.apk"
          mkdir -p dist
          cp "$apk" "dist/$filename"
          (cd dist && sha256sum "$filename" > "$filename.sha256")
          printf 'version=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"

      - name: Upload APK for release publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload unit test reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Android/src/app/build/reports/tests/testDebugUnitTest/
            Android/src/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish APK to Releases
    needs: build
    if: github.repository == 'shadow-pheonix/gallery' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk-${{ github.sha }}-${{ github.run_attempt }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          cat > release-notes.md <<EOF
          APK built and tested by GitHub Actions from commit ${GITHUB_SHA}.

          - Requires Android 12 (API 31) or later.
          - Uses the same signing certificate as the original custom APK and previous releases.
          - Release variant signed with this fork's existing Android debug key.
          - Includes a SHA-256 checksum alongside the APK.
          - Browser-based Hugging Face sign-in requires your own OAuth configuration; a token can be entered in Settings.

          Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$RELEASE_TAG" dist/*.apk dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AI Edge Gallery ${RELEASE_VERSION}" \
            --notes-file release-notes.md --latest
          printf '### APK release\n\n[Download APK](https://github.com/%s/releases/tag/%s)\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
